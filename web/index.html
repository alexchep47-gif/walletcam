<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Walletcam — Trésorerie et gestion de caisse offline-first pour commerçants camerounais. Ardoises, relances, solde de caisse.">
  <meta name="theme-color" content="#0B1426">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Walletcam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Walletcam — Trésorerie</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0B1426;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .loading h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      color: #00C9A7;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <h1>WALLET CAM</h1>
    <p style="opacity:0.6;margin:0">Chargement de la trésorerie…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
